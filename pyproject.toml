[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matview"
dynamic = ["version"]
description = "Materialized views for derived values: a content-addressed compute cache over a dependency graph."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tiago Tresoldi", email = "tresoldi@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cache", "build-system", "dag", "memoization", "sqlite", "materialized-view"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
# The core stays deliberately light: SQLite is stdlib, tomllib is stdlib, and the
# only non-stdlib piece is RFC 8785 canonicalization, which is the one thing that
# must not be hand-rolled. See DECISIONS.md D3.
dependencies = ["rfc8785>=0.1.4"]

[project.urls]
Homepage = "https://github.com/tresoldi/matview"
Source = "https://github.com/tresoldi/matview"
Documentation = "https://tresoldi.github.io/matview/"
Issues = "https://github.com/tresoldi/matview/issues"
Changelog = "https://github.com/tresoldi/matview/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Codecs are extras so the core installs with no heavy dependencies.
# Floors are the oldest versions the cross-version byte-determinism job actually
# checks; see docs/ci-workflow.yml and DECISIONS.md D29.
arrow = ["polars>=1.20", "pyarrow>=16.0"]
npy = ["numpy>=1.26"]
json = []
all = ["matview[arrow,npy,json]"]
# Documentation site.
docs = [
  # Upper-bounded deliberately: MkDocs 2.0 removes the plugin system and the theming
  # system with no migration path, which would take mkdocstrings and the Material
  # theme with it. Lift this only after checking the site still builds.
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.26",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pre-commit>=4.0",
  # ruff and mypy are pinned exactly, and .pre-commit-config.yaml pins the same
  # versions. Unpinned they drift between the local venv, the hook and CI, and the
  # same code then passes in one and fails in another.
  "ruff==0.16.8",
  "mypy==2.3.1",
]

[tool.hatch.version]
path = "matview/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["matview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff formats Python code blocks inside Markdown. SPEC.md and docs/design-spec.md are
# verbatim contracts that must not be rewritten by a formatter, so Markdown is out of
# scope entirely rather than excluded file by file.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

# The core must typecheck with no codec extras installed, so the optional libraries the
# codec modules import lazily are not resolvable here. Their use is confined to those
# modules and covered by the codec tests, which do run with the extras present.
[[tool.mypy.overrides]]
module = ["polars.*", "pyarrow.*", "numpy.*"]
ignore_missing_imports = true
