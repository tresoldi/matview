# Intended contents of .github/workflows/ci.yml.
#
# It lives here rather than in place because the automation account that opened this
# branch has no `workflow` OAuth scope and GitHub rejects any push that creates or
# updates a file under .github/workflows/. Copy it across from a session that does:
#
#     mkdir -p .github/workflows && git mv docs/ci-workflow.yml .github/workflows/ci.yml
#
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run --extra dev mypy matview

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python-version }}
      - name: Test with the core only (no codec extras installed)
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest
      - name: Test with every codec extra installed
        run: uv run --python ${{ matrix.python-version }} --all-extras pytest

  # Codec byte-determinism has to hold across library versions, not just across
  # runs on one machine, so stage 6 adds a job here that pins old and new polars,
  # numpy and pyarrow and asserts the golden payload bytes are identical under each.
