# Staged, not installed. Copy to .github/workflows/release.yml — see RELEASING.md.
#
# Publishing is tag-driven and credential-free: PyPI trusted publishing exchanges this
# workflow's OIDC token for an upload token, so there is no long-lived secret in the
# repository. That binds releases to *this file name* and the environment below, which is
# why renaming either means re-registering the publisher on PyPI.
name: Release

on:
  push:
    tags: ["v*"]
  # A dry run publishes to TestPyPI instead, so the whole path can be exercised without
  # burning a version number on the real index.
  workflow_dispatch:
    inputs:
      index:
        description: Where to publish
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  verify:
    name: Checks, and the tag against __version__
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: make check
      # The version has one home, `__version__` in src/matview/__init__.py, and hatchling
      # reads the distribution's version from it. A tag that disagrees would publish a
      # file whose name and metadata contradict each other, so it fails here instead.
      - name: The tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          packaged=$(uv run --no-project --with . python -c 'import matview; print(matview.__version__)')
          tag=${GITHUB_REF_NAME#v}
          if [ "$packaged" != "$tag" ]; then
            echo "tag v$tag disagrees with __version__ $packaged" >&2
            exit 1
          fi

  build:
    name: Build and check the distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      # Builds the sdist and wheel, validates the metadata, and installs the wheel in
      # isolation to check that the package it produces actually imports, ships py.typed
      # and runs its console script.
      - run: make release-check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to ${{ (github.event_name == 'push' || inputs.index == 'pypi') && 'PyPI' || 'TestPyPI' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'push' || inputs.index == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'push' || inputs.index == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  github-release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The release notes are the CHANGELOG section for this version, not a generated
      # commit list: the changelog is written for readers and the commit list is not.
      - name: Extract this version's changelog section
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {inside = 1; next}
            inside && /^## / {exit}
            inside {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
